    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            /* Design Tokens */
            --bg:          #f4f3ef;       
            --surface:     #faf9f6;       
            --sidebar:     #eae8e2;       
            --border:      #d9d7cf;       
            --text:        #3a3832;       
            --text-muted:  #8c8880;       
            --blue:        #7a9db8;       
            --blue-light:  #dde8f0;       
            --sage:        #8aab96;       
            --sage-light:  #ddeae3;       
            --accent:      #7a9db8;       
            --error:       #c97070;       
            --radius:      8px;           
            --shadow:      0 4px 16px rgba(58, 56, 50, 0.08); 
            
            --toast-bg:    var(--text);
            --active-tab:  var(--surface);
            --tab-hover:   #e0ddd6;
            --scrollbar:   #ccc9c0;
        }

        .dark {
            --bg:          #262520;       
            --surface:     #2e2c28;       
            --sidebar:     #1f1e1b;       
            --border:      #3a3830;       
            --text:        #e8e4dc;       
            --text-muted:  #7a7670;       
            --blue:        #8fb3cc;       
            --blue-light:  #1e2e3a;
            --accent:      #8fb3cc;       
            --shadow:      0 4px 16px rgba(0,0,0,0.25);
        }

        html, body { height: 100%; }

        body {
            font-family: 'DM Sans', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            overflow: hidden;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
            transition: background 0.3s, color 0.3s;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: var(--radius); }

        /* Sidebar */
        aside {
            width: 260px;
            flex-shrink: 0;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: background 0.3s, border-color 0.3s;
        }

        .sidebar-top { padding: 28px 20px 16px; flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }

        .app-wordmark {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text);
            opacity: 0.75;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .app-icon-svg {
            width: 20px;
            height: 20px;
            color: var(--blue);
        }

        /* Tab List */
        #tabsList {
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 0 8px;
        }

        .tab-item {
            background: none;
            border: 2px solid transparent;
            cursor: pointer;
            text-align: left;
            padding: 10px 12px;
            border-radius: var(--radius);
            font-size: 13.5px;
            font-family: 'DM Sans', sans-serif;
            color: var(--text-muted);
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.15s, color 0.15s, opacity 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
            position: relative;
        }
        .tab-item:hover { background: var(--tab-hover); color: var(--text); }
        .tab-item.active {
            background: var(--active-tab);
            color: var(--text);
            font-weight: 500;
            box-shadow: var(--shadow);
        }
        
        /* Drag and Drop states */
        .tab-item.dragging { 
            opacity: 0.3; 
            background: var(--tab-hover); 
            border: 2px dashed var(--blue);
        }
        .tab-item.drag-over { 
            border-top: 2px solid var(--blue);
            background: var(--blue-light);
        }

        .tab-item .tab-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--blue);
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .tab-item.active .tab-dot { opacity: 1; }
        .tab-item .tab-locked-icon { margin-left: auto; flex-shrink: 0; opacity: 0.4; }

        /* Footer */
        .sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--border); }
        .footer-actions { display: flex; align-items: center; gap: 4px; margin-bottom: 14px; }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 8px;
            border-radius: calc(var(--radius) - 2px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
            flex: 1;
        }
        .icon-btn:hover { background: var(--tab-hover); color: var(--text); }

        .persistence-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            opacity: 0.5;
        }
        .persistence-badge::before {
            content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--sage);
        }

        /* Editor */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--surface);
            overflow: hidden;
            transition: background 0.3s;
        }

        .editor-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px 18px; 
            border-bottom: 1px solid var(--border);
            gap: 12px;
            flex-shrink: 0;
        }

        #tabTitleInput {
            background: transparent;
            border: none;
            font-family: 'DM Sans', sans-serif;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text);
            flex-grow: 1;
        }
        #tabTitleInput:focus { outline: none; }

        .toolbar-actions { display: flex; align-items: center; gap: 4px; }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 7px 10px;
            border-radius: calc(var(--radius) - 2px);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: var(--text-muted);
            transition: background 0.15s, color 0.15s;
        }
        .action-btn:hover { background: var(--blue-light); color: var(--blue); }
        .action-btn.locked-state { color: var(--sage); }
        .action-btn.locked-state:hover { background: var(--sage-light); color: var(--sage); }
        
        .action-btn.delete-btn:hover { 
            color: var(--error); 
            background: rgba(201, 112, 112, 0.1); 
        }

        #noteArea {
            min-height: 100%;
            padding: 40px 40px 80px; 
            max-width: 900px;
            margin: 0; 
            font-size: 16px;
            line-height: 1.85;
            color: var(--text);
            outline: none;
            transition: max-width 0.3s ease;
        }

        #noteArea.multi-column {
            column-count: 2;
            column-gap: 48px;
            column-rule: 1px solid var(--border);
            max-width: 1200px;
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: var(--toast-bg);
            color: var(--surface);
            padding: 10px 18px;
            border-radius: var(--radius);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.25s, transform 0.25s;
            z-index: 100;
            box-shadow: var(--shadow);
        }
        .dark #toast { color: var(--bg); }

        .hidden { display: none; }
    </style>
</head>

        </div>
    </aside>

    <main>
        <input type="file" id="fileInput" class="hidden" accept=".json">
        <div class="editor-toolbar">
            <input id="tabTitleInput" type="text" placeholder="Naamloze notitie" autocomplete="off" spellcheck="false">
            <div class="toolbar-actions">
                <button id="addTab" class="action-btn" title="Nieuwe notitie">
                    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
                    </svg>
                </button>
                <button id="copyBtn" class="action-btn" title="Kopieer tekst">
                    <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                </button>
                <button id="columnToggle" class="action-btn" title="Wissel weergave">
                    <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2zm10 0h-2a2 2 0 00-2 2v12a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2z"/></svg>
                </button>
                <button id="lockToggle" class="action-btn" title="Vergrendel/ontgrendel">
                    <svg id="lockIcon" width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"/></svg>
                </button>
                <button id="deleteTab" class="action-btn delete-btn" title="Verwijder notitie">
                    <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
            </div>
        </div>

        <div style="flex-grow:1; overflow-y:auto;">
            <div id="noteArea" contenteditable="false" data-placeholder="Begin met schrijven…"></div>
        </div>
    </main>

    <div id="toast"></div>

    <script>
        const STORAGE_KEY = 'notes_app_storage_v2';
        let state = { 
            activeTabId: null, 
            tabs: [{ id: Date.now(), title: 'Aan de slag', content: '<b>Welkom.</b><br><br>Dit is je automatische notitie-systeem. Je kunt notities verslepen om de volgorde te wijzigen.', locked: true, columns: 1 }], 
            isDarkMode: window.matchMedia('(prefers-color-scheme: dark)').matches 
        };
        
        let draggedTabId = null;

        const tabsList = document.getElementById('tabsList'), 
              noteArea = document.getElementById('noteArea'), 
              tabTitleInput = document.getElementById('tabTitleInput'), 
              lockToggle = document.getElementById('lockToggle'), 
              columnToggle = document.getElementById('columnToggle'),
              themeToggle = document.getElementById('themeToggle'), 
              toast = document.getElementById('toast');

        // Persistentie & Initialisatie
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) { try { state = { ...state, ...JSON.parse(saved) }; } catch(e) {} }
        if (!state.activeTabId && state.tabs.length > 0) state.activeTabId = state.tabs[0].id;

        function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

        function showToast(msg) {
            toast.textContent = msg; toast.style.opacity = '1'; toast.style.transform = 'translateY(-4px)';
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateY(6px)'; }, 2000);
        }

        function applyTheme() {
            document.documentElement.classList.toggle('dark', state.isDarkMode);
            document.getElementById('sunIcon').classList.toggle('hidden', !state.isDarkMode);
            document.getElementById('moonIcon').classList.toggle('hidden', state.isDarkMode);
        }

        function renderTabs() {
            tabsList.innerHTML = '';
            state.tabs.forEach((tab, index) => {
                const btn = document.createElement('button');
                btn.className = 'tab-item' + (tab.id === state.activeTabId ? ' active' : '');
                btn.draggable = true;
                btn.dataset.id = tab.id;
                
                btn.innerHTML = `<span class="tab-dot"></span><span>${tab.title || 'Naamloos'}</span>`;
                if(tab.locked) btn.innerHTML += `<span class="tab-locked-icon"><svg width="10" height="10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg></span>`;
                
                // Klik actie
                btn.onclick = () => { state.activeTabId = tab.id; renderEditor(); renderTabs(); saveState(); };

                // Drag & Drop handlers
                btn.addEventListener('dragstart', (e) => {
                    draggedTabId = tab.id;
                    btn.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                });

                btn.addEventListener('dragend', () => {
                    btn.classList.remove('dragging');
                    document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('drag-over'));
                });

                btn.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if (draggedTabId !== tab.id) {
                        btn.classList.add('drag-over');
                    }
                });

                btn.addEventListener('dragleave', () => {
                    btn.classList.remove('drag-over');
                });

                btn.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (draggedTabId !== tab.id) {
                        reorderTabs(draggedTabId, tab.id);
                    }
                });

                tabsList.appendChild(btn);
            });
        }

        function reorderTabs(sourceId, targetId) {
            const sourceIndex = state.tabs.findIndex(t => t.id === sourceId);
            const targetIndex = state.tabs.findIndex(t => t.id === targetId);
            
            if (sourceIndex !== -1 && targetIndex !== -1) {
                const [movedTab] = state.tabs.splice(sourceIndex, 1);
                state.tabs.splice(targetIndex, 0, movedTab);
                
                renderTabs();
                saveState();
                showToast("Volgorde aangepast");
            }
        }

        function renderEditor() {
            const tab = state.tabs.find(t => t.id === state.activeTabId);
            if (!tab) {
                noteArea.innerHTML = '';
                tabTitleInput.value = '';
                noteArea.contentEditable = false;
                return;
            }
            noteArea.innerHTML = tab.content || '';
            tabTitleInput.value = tab.title || '';
            noteArea.contentEditable = !tab.locked;
            tabTitleInput.readOnly = tab.locked;
            lockToggle.classList.toggle('locked-state', tab.locked);
            lockToggle.title = tab.locked ? 'Ontgrendel notitie' : 'Vergrendel notitie';
            
            const isMulti = (tab.columns || 1) === 2;
            noteArea.classList.toggle('multi-column', isMulti);
        }

        document.getElementById('addTab').onclick = () => {
            const newTab = { id: Date.now(), title: '', content: '', locked: false, columns: 1 };
            state.tabs.push(newTab);
            state.activeTabId = newTab.id;
            renderTabs();
            renderEditor();
            tabTitleInput.focus();
            saveState();
        };

        document.getElementById('deleteTab').onclick = () => {
            if (state.tabs.length <= 1) {
                showToast("Kan laatste notitie niet verwijderen");
                return;
            }
            state.tabs = state.tabs.filter(t => t.id !== state.activeTabId);
            state.activeTabId = state.tabs[0].id;
            renderTabs();
            renderEditor();
            saveState();
            showToast("Notitie verwijderd");
        };

        columnToggle.onclick = () => {
            const tab = state.tabs.find(t => t.id === state.activeTabId);
            if (tab && !tab.locked) {
                tab.columns = (tab.columns === 1 || !tab.columns) ? 2 : 1;
                renderEditor();
                saveState();
            } else if (tab?.locked) {
                showToast("Notitie is vergrendeld");
            }
        };

        themeToggle.onclick = () => { state.isDarkMode = !state.isDarkMode; applyTheme(); saveState(); };
        noteArea.oninput = () => { const tab = state.tabs.find(t => t.id === state.activeTabId); if(tab && !tab.locked) { tab.content = noteArea.innerHTML; saveState(); } };
        tabTitleInput.oninput = (e) => { const tab = state.tabs.find(t => t.id === state.activeTabId); if(tab && !tab.locked) { tab.title = e.target.value; renderTabs(); saveState(); } };
        lockToggle.onclick = () => { const tab = state.tabs.find(t => t.id === state.activeTabId); if(tab) { tab.locked = !tab.locked; renderEditor(); renderTabs(); saveState(); showToast(tab.locked ? 'Vergrendeld' : 'Ontgrendeld'); } };
        
        document.getElementById('copyBtn').onclick = () => {
            const text = noteArea.innerText;
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast("Gekopieerd naar klembord");
        };

        document.getElementById('exportBtn').onclick = () => {
            const data = JSON.stringify(state);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `notes-backup-${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast("Back-up geëxporteerd");
        };

        document.getElementById('importBtn').onclick = () => document.getElementById('fileInput').click();
        document.getElementById('fileInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (imported.tabs) {
                        state = imported;
                        applyTheme();
                        renderTabs();
                        renderEditor();
                        saveState();
                        showToast("Back-up succesvol geïmporteerd");
                    }
                } catch(err) {
                    showToast("Ongeldig back-up bestand");
                }
            };
            reader.readAsText(file);
        };

        applyTheme(); renderTabs(); renderEditor();
    </script>
</body>
</html>
